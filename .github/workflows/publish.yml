name: publish package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pushed release tag (for example v_2.2.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version: "latest"
          cache: "pnpm"
          package-manager-cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: run unit tests
        run: pnpm test run

      - name: setup integration test environment
        run: pnpm playwright install --with-deps

      - name: run integration tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: build package
        run: pnpm build-all

      - name: validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
          if [[ "$RELEASE_TAG" != "v_${PACKAGE_VERSION}" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
