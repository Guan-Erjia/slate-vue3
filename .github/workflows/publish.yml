name: publish package
on: workflow_dispatch
permissions: write-all
jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # semantic-release needs the full history and tags to determine the
          # next version from conventional commits.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version: 'latest'
          cache: 'pnpm'
          package-manager-cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: run unit tests
        run: pnpm test run

      - name: setup integration test environment
        run: pnpm playwright install --with-deps

      - name: run integration tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: build package
        run: pnpm build-all

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps the version from conventional commits, updates CHANGELOG.md,
      # publishes to npm, commits the bump and creates the GitHub release.
      - name: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
